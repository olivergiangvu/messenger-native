name: macOS Build and Regression Tests

on:
  pull_request:
    branches:
      - develop
      - feature/link-routing-reels
      - feature/notification-nowplaying
      - feature/call-ringtone-lifecycle
      - feature/call-permissions-latency
  workflow_dispatch:

concurrency:
  group: messenger-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Routing regression
        run: |
          swiftc "Ma nguon/LinkRouting.swift" "Tests/LinkRoutingTests.swift" -o /tmp/mn-routing-tests
          /tmp/mn-routing-tests
      - name: WebView JavaScript regression
        run: |
          node Tests/ReelPreviewTests.cjs
          node Tests/NotificationEngineTests.cjs
          node Tests/IncomingCallAudioTests.cjs
          node Tests/SafeFloatingCallActionsTests.cjs
      - name: Validate developer installer shell syntax
        run: bash -n install-local.sh
      - name: Build unsigned test application (ad hoc)
        env:
          KY_APP: "-"
        run: |
          bash build.sh "$RUNNER_TEMP/messenger-native-ci"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/notification-engine.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/reel-preview.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/incoming-call-audio.js"
