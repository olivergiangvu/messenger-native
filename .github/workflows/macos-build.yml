name: macOS Build and Regression Tests

on:
  pull_request:
    branches:
      - develop
      - feature/link-routing-reels
      - feature/notification-nowplaying
      - feature/call-ringtone-lifecycle
      - feature/call-permissions-latency
      - feature/stage-manager-localization
      - feature/notification-deeplink
      - feature/notification-clean-preview
      - feature/notification-preview-native-filter
      - feature/notification-emoji-preview
      - feature/notification-all-window-states
      - feature/notification-focus-dedup
      - feature/dock-unread-accuracy
      - feature/notification-event-freshness
      - feature/notification-center-history
      - feature/reels-default-browser
      - feature/notification-relative-time-fix
  workflow_dispatch:

concurrency:
  group: messenger-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Routing regression
        run: |
          swiftc "Ma nguon/LinkRouting.swift" "Tests/LinkRoutingTests.swift" -o /tmp/mn-routing-tests
          /tmp/mn-routing-tests
          swiftc "Ma nguon/NotificationDeepLink.swift" "Tests/NotificationDeepLinkTests.swift" -o /tmp/mn-notification-deeplink-tests
          /tmp/mn-notification-deeplink-tests
          swiftc "Ma nguon/NotificationPreviewFormatter.swift" "Tests/NotificationPreviewFormatterTests.swift" -o /tmp/mn-preview-formatter-tests
          /tmp/mn-preview-formatter-tests
          swiftc "Ma nguon/NotificationDeduplicator.swift" "Tests/NotificationDeduplicatorTests.swift" -o /tmp/mn-notification-dedup-tests
          /tmp/mn-notification-dedup-tests
          swiftc "Ma nguon/NotificationDisplayPolicy.swift" "Tests/NotificationDisplayPolicyTests.swift" -o /tmp/mn-notification-display-tests
          /tmp/mn-notification-display-tests
          swiftc "Ma nguon/IncomingCallAlertGate.swift" "Tests/IncomingCallAlertGateTests.swift" -o /tmp/mn-call-alert-gate-tests
          /tmp/mn-call-alert-gate-tests
      - name: WebView JavaScript regression
        run: |
          node Tests/ReelPreviewTests.cjs
          node Tests/NotificationEngineTests.cjs
          node Tests/NotificationEmojiTests.cjs
          node Tests/NotificationNavigationTests.cjs
          node Tests/IncomingCallAudioTests.cjs
          node Tests/IncomingCallAlertReliabilityTests.cjs
          node Tests/IncomingCallWebHintTests.cjs
          node Tests/MenuLocalizationTests.cjs
          node Tests/InterfaceLocalizationTests.cjs
      - name: Validate macOS localization resources
        run: |
          plutil -lint "Ma nguon/en.lproj/Menu.strings"
          plutil -lint "Ma nguon/vi.lproj/Menu.strings"
          plutil -lint "Ma nguon/en.lproj/Interface.strings"
          plutil -lint "Ma nguon/vi.lproj/Interface.strings"
          plutil -lint "Ma nguon/en.lproj/InfoPlist.strings"
          plutil -lint "Ma nguon/vi.lproj/InfoPlist.strings"
          plutil -lint "Ma nguon/Info.plist"
      - name: Validate developer installer shell syntax
        run: bash -n install-local.sh
      - name: Build unsigned test application (ad hoc)
        env:
          KY_APP: "-"
        run: |
          bash build.sh "$RUNNER_TEMP/messenger-native-ci"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/notification-engine.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/notification-navigation.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/reel-preview.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/incoming-call-audio.js"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/en.lproj/Menu.strings"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/vi.lproj/Menu.strings"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/en.lproj/Interface.strings"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/vi.lproj/Interface.strings"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/en.lproj/InfoPlist.strings"
          test -f "$RUNNER_TEMP/messenger-native-ci/Messenger Native.app/Contents/Resources/vi.lproj/InfoPlist.strings"
